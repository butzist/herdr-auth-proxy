[package]
name = "herdr-auth-proxy"
version = "0.1.0"
edition = "2024"
description = "Proxy for herdr socket that authenticates clients and filters commands"
repository = "https://github.com/butzist/herdr-auth-proxy"

[lib]
name = "herdr_auth_proxy"
path = "src/lib.rs"

[[bin]]
name = "herdr-auth-proxy"
path = "src/main.rs"

[[bin]]
name = "herdr-auth"
path = "src/bin/herdr-auth.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
base64 = "0.22"
libc = "0.2"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "net",
    "io-util",
    "fs",
    "time",
    "signal",
] }
futures-core = "0.3"

[dev-dependencies]
mockall = "0.13"

[lints.cargo]
unused_dependencies = "allow"
