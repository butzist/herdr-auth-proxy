[package]
name = "herdr-auth-proxy"
version = "0.1.0"
edition = "2024"
description = "Proxy for herdr socket that authenticates clients and filters commands"
repository = "https://github.com/butzist/herdr-auth-proxy"

[[bin]]
name = "herdr-auth-proxy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
futures-core = "0.3"

[dev-dependencies]
mockall = "0.13"
